[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "glaucoma-model"
version = "0.1.0"
description = "Glaucoma detection: segmentation-based biomarker extraction + multimodal classification"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]
